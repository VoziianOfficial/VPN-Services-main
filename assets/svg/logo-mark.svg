<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 72 72"
  role="img"
  aria-labelledby="vpn-logo-mark-title vpn-logo-mark-desc"
>
  <title id="vpn-logo-mark-title">OrbitLock VPN</title>
  <desc id="vpn-logo-mark-desc">
    Abstract privacy and location symbol formed by intertwined route pins and an encrypted central path.
  </desc>

  <g
    fill="none"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- Left intertwined location contour -->
    <path
      d="
        M34.8 10.2
        C30.9 6.8 25.7 5.3 20.8 6.2
        C13.5 7.5 8.2 13.8 8.2 21.3
        C8.2 31.2 17.3 39.5 27.4 49.7
        L34.8 57.2
      "
      stroke="#FFFFFF"
      stroke-width="4.2"
    />

    <!-- Right intertwined location contour -->
    <path
      d="
        M37.2 10.2
        C41.1 6.8 46.3 5.3 51.2 6.2
        C58.5 7.5 63.8 13.8 63.8 21.3
        C63.8 31.2 54.7 39.5 44.6 49.7
        L37.2 57.2
      "
      stroke="#FFFFFF"
      stroke-width="4.2"
    />

    <!-- Inner shield / route connection -->
    <path
      d="
        M25.1 23.8
        C25.1 18.1 29.6 13.6 35.3 13.6
        H36.7
        C42.4 13.6 46.9 18.1 46.9 23.8
        C46.9 31.4 40.4 37.3 36 41.6
        C31.6 37.3 25.1 31.4 25.1 23.8
        Z
      "
      stroke="#22C55E"
      stroke-width="3.4"
    />

    <!-- Encrypted route -->
    <path
      d="
        M30.4 25.1
        C32.3 22.8 34.1 22.1 36 22.1
        C38.2 22.1 39.8 23 41.6 25.2
      "
      stroke="#FF5A1F"
      stroke-width="2.8"
    />

    <!-- Keyhole head -->
    <circle
      cx="36"
      cy="27.4"
      r="3.2"
      stroke="#FFFFFF"
      stroke-width="2.8"
    />

    <!-- Keyhole / encrypted route tail -->
    <path
      d="
        M36 30.6
        V35.8
        L39.3 39
      "
      stroke="#FFFFFF"
      stroke-width="2.8"
    />

    <!-- Lower convergence -->
    <path
      d="
        M34.8 57.2
        L36 58.5
        L37.2 57.2
      "
      stroke="#FFFFFF"
      stroke-width="4.2"
    />

    <!-- Orbital route -->
    <path
      d="
        M12.1 49.6
        C18.2 60.4 31 66.2 43.7 63.9
        C52.4 62.3 59.4 57.9 63.8 51.7
      "
      stroke="#FFFFFF"
      stroke-width="2"
      opacity="0.72"
    />

    <!-- Short secondary orbit -->
    <path
      d="
        M14.5 43.6
        C18.1 49.5 22.8 53.6 28.2 56
      "
      stroke="#FFFFFF"
      stroke-width="1.8"
      opacity="0.38"
    />
  </g>

  <!-- Green orbital node -->
  <circle
    cx="12.1"
    cy="49.6"
    r="3.6"
    fill="#22C55E"
  />

  <!-- Orange orbital node -->
  <circle
    cx="63.8"
    cy="51.7"
    r="3.6"
    fill="#FF5A1F"
  />

  <!-- Tiny encrypted node -->
  <circle
    cx="36"
    cy="58.5"
    r="2.2"
    fill="#FFFFFF"
  />
</svg>
